name: Frayed
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
settings:
  base:
    DEVELOPMENT_TEAM: UKUPW4MBU8
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  Frayed:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Fonts/**"]
      - path: Shared
      # Listed one by one so they land flat at the bundle root, where the
      # UIAppFonts names below expect them (skill trap 12).
      - path: Sources/Fonts/BricolageGrotesque96pt-Bold.ttf
        buildPhase: resources
      - path: Sources/Fonts/BricolageGrotesque96pt-ExtraBold.ttf
        buildPhase: resources
      - path: Sources/Fonts/BricolageGrotesque-Regular.ttf
        buildPhase: resources
      - path: Sources/Fonts/BricolageGrotesque-Medium.ttf
        buildPhase: resources
      - path: Sources/Fonts/BricolageGrotesque-SemiBold.ttf
        buildPhase: resources
      - path: Sources/Fonts/BricolageGrotesque-Bold.ttf
        buildPhase: resources
      - path: Sources/Fonts/CourierPrime-Regular.ttf
        buildPhase: resources
      - path: Sources/Fonts/CourierPrime-Bold.ttf
        buildPhase: resources
      - path: Sources/Fonts/CourierPrime-Italic.ttf
        buildPhase: resources
      - path: Sources/Fonts/BricolageGrotesque-OFL.txt
        buildPhase: resources
      - path: Sources/Fonts/CourierPrime-OFL.txt
        buildPhase: resources
    # The friends layer only (Phase 5); the test target compiles FrayedCore
    # alone and never links it.
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iflora.frayed
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Sign in with Apple and Declared Age Range come back with the social
    # phase; the age gate is a local birth-year check until then.
    entitlements:
      path: Sources/Frayed.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Frayed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        NSFaceIDUsageDescription: "Frayed uses Face ID to keep your recaps private."
        # RECAP 10.2: every read type named, caffeine included (5.1.1).
        NSHealthShareUsageDescription: "Frayed reads heart rate, resting heart rate, heart rate variability, sleep, steps, workouts, exercise minutes, active energy and any caffeine you log, to write your evening recap. It stays on this iPhone unless you post a recap, and then only the few numbers on the card leave."
        # Read-only app, but the HealthKit entitlement makes App Store
        # Connect demand the write string too (export fails without it).
        NSHealthUpdateUsageDescription: "Frayed does not write to Apple Health. This entry exists because Apple requires it for any app with Health access."
        NSCalendarsFullAccessUsageDescription: "Frayed reads today's events on this iPhone to note which spikes overlapped a meeting. Titles and attendee counts stay on the phone and are never uploaded."
        BGTaskSchedulerPermittedIdentifiers: [com.iflora.frayed.refresh]
        UIBackgroundModes: [fetch]
        ITSAppUsesNonExemptEncryption: false
        # frayed://invite/CODE opens Friends with the code filled in.
        CFBundleURLTypes:
          - CFBundleURLName: com.iflora.frayed.invite
            CFBundleURLSchemes: [frayed]
        UIAppFonts:
          - BricolageGrotesque96pt-Bold.ttf
          - BricolageGrotesque96pt-ExtraBold.ttf
          - BricolageGrotesque-Regular.ttf
          - BricolageGrotesque-Medium.ttf
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - CourierPrime-Regular.ttf
          - CourierPrime-Bold.ttf
          - CourierPrime-Italic.ttf
    scheme:
      testTargets: [FrayedTests]
  FrayedTests:
    type: bundle.unit-test
    platform: iOS
    # No host app: the tests compile FrayedCore directly and run standalone.
    sources:
      - path: Tests
      - path: Shared/FrayedCore
