# Generates the Xcode project with XcodeGen and runs the unit tests on every
# push. Archiving, signing with Xcode cloud signing through the App Store
# Connect API key and uploading to TestFlight only happen on a manual run
# with `upload` checked - a push must never mint a TestFlight build, because
# the build number is the run number and macOS runner minutes cost money.
#
#   gh workflow run iOS -f upload=true
#   gh workflow run iOS -f upload=false   (build and test only)
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8).
name: iOS

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'store/**'
      - 'docs/**'
      - 'design-canvas/**'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Archive, sign and upload the build to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  TEAM_ID: UKUPW4MBU8
  SCHEME: Frayed

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: |
          sed -i '' "s|CURRENT_PROJECT_VERSION: \"1\"|CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"|" project.yml
          grep -n CURRENT_PROJECT_VERSION project.yml
          xcodegen generate
          test -d "${SCHEME}.xcodeproj"

      # Pure Swift only: the test target compiles this folder with no host
      # app, and everything framework-shaped (Health, EventKit, background
      # tasks, intents, notifications) lives in Sources/.
      - name: FrayedCore purity
        run: |
          bad=$(grep -rlE '^[[:space:]]*import (UIKit|SwiftUI|HealthKit|WatchConnectivity|LocalAuthentication|WidgetKit|EventKit|BackgroundTasks|AppIntents|UserNotifications)' Shared/FrayedCore || true)
          test -z "$bad" || { echo "FrayedCore imports platform frameworks: $bad"; exit 1; }

      - name: Unit tests
        run: |
          set -o pipefail
          sim=$(xcrun simctl list devices available iPhone | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "simulator: $sim"
          xcodebuild test -project "${SCHEME}.xcodeproj" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$sim" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Archive (unsigned)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project "${SCHEME}.xcodeproj" -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release -destination "generic/platform=iOS" \
            archive -archivePath "build/${SCHEME}.xcarchive" \
            -skipMacroValidation -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log

      # An unsigned archive carries no entitlements, and -exportArchive would
      # then drop HealthKit. Ad-hoc signing needs no certificate and puts the
      # entitlements into the bundle so the real export keeps them. Keys are
      # matched whole: a bare "healthkit" would also match
      # healthkit.background-delivery.
      - name: Embed entitlements (ad-hoc sign)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          app="build/${SCHEME}.xcarchive/Products/Applications/${SCHEME}.app"
          codesign --force --sign - --entitlements Sources/Frayed.entitlements "$app"
          ents=$(codesign -d --entitlements :- "$app" 2>/dev/null | tr -d '\0')
          echo "$ents"
          for key in com.apple.developer.healthkit com.apple.developer.healthkit.access \
                     com.apple.developer.healthkit.background-delivery; do
            echo "$ents" | grep -q "<key>${key}</key>" \
              || { echo "::error::ad-hoc entitlements did not stick on ${SCHEME}.app: ${key}"; exit 1; }
          done

      # Checked here rather than by an ITMS-91053 email days after upload.
      - name: Privacy manifest is in the bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          app="build/${SCHEME}.xcarchive/Products/Applications/${SCHEME}.app"
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy missing from ${SCHEME}.app (ITMS-91053)"; exit 1; }

      # UIAppFonts names bare files, so they must sit at the bundle root;
      # a missing one falls back to the system font without any error.
      - name: Fonts are in the bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          app="build/${SCHEME}.xcarchive/Products/Applications/${SCHEME}.app"
          for font in Sources/Fonts/*.ttf; do
            test -f "$app/$(basename "$font")" || { echo "::error::$(basename "$font") missing from ${SCHEME}.app root"; exit 1; }
          done

      - name: App Store Connect API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # The export signs with whatever the cloud-fetched profile grants and
      # drops the rest silently (skill trap 12b). Export to disk once and read
      # the real entitlements, because `destination: upload` leaves no .ipa.
      # Without the two HealthKit keys the recap finds nothing and nothing
      # says why. healthkit.access is an empty array and may be stripped, so
      # it is only printed, not required.
      - name: HealthKit survives export signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/export_check.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "build/${SCHEME}.xcarchive" \
            -exportOptionsPlist build/export_check.plist -exportPath build/check \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/export_check.log | grep -E "error:|\*\* EXPORT" || true
          ipa=$(ls build/check/*.ipa 2>/dev/null | head -1)
          test -n "$ipa" || { echo "::error::no ipa produced by the verification export"; exit 1; }
          rm -rf build/ipa && mkdir -p build/ipa && (cd build/ipa && unzip -qq "$GITHUB_WORKSPACE/$ipa")
          app=$(ls -d build/ipa/Payload/*.app | head -1)
          ents=$(codesign -d --entitlements :- "$app" 2>/dev/null | tr -d '\0')
          echo "=== $(basename "$app") entitlements after export signing"
          echo "$ents"
          fail=0
          for key in com.apple.developer.healthkit com.apple.developer.healthkit.background-delivery; do
            if echo "$ents" | grep -q "<key>${key}</key>"; then
              echo "OK ${key}"
            else
              echo "::error::${key} missing from the exported app - check HealthKit (and Background Delivery) on the App ID"
              fail=1
            fi
          done
          echo "$ents" | grep -q "<key>com.apple.developer.healthkit.access</key>" \
            && echo "OK com.apple.developer.healthkit.access" \
            || echo "::warning::com.apple.developer.healthkit.access not present (empty array, usually harmless)"
          test "$fail" -eq 0

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "build/${SCHEME}.xcarchive" \
            -exportOptionsPlist build/export_options.plist -exportPath build/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/export.log | grep -E "error:|Upload|\*\* EXPORT|application-groups|provisioning profile" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" build/export.log

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            test.log
            build/*.log
          if-no-files-found: ignore
